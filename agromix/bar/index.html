  function u(b){var r=atob(b),a=new Uint8Array(r.length);for(var k=0;k<r.length;k++)a[k]=r.charCodeAt(k);return a;}
  async function open_(pw){
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
    return new TextDecoder().decode(pt);
  }
  async function go(pw,quiet){

      history.replaceState(null,'',location.pathname);document.open();document.write(h);document.close();}
    catch(_){g.disabled=false;g.textContent='Войти';if(!quiet)e.textContent='Неверный пароль';try{sessionStorage.removeItem('agx');}catch(_){}}
